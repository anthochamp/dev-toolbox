name: Node.js common lint jobs

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: The branch, tag or SHA to checkout. Defaults to the reference or SHA for that event.
        required: false
        type: string
      node-package-manager:
        description: "Node.js package manager to use: npm, yarn or pnpm"
        required: true
        type: string
      node-version:
        description: "Version Spec of the Node.js version to use (takes precedence over node-version-file). Examples: 12.x, 10.15.1, >=10.15.0."
        required: false
        type: string
      node-version-file:
        description: "File containing the version Spec of the version to use. Examples: package.json, .nvmrc, .node-version, .tool-versions."
        required: false
        type: string
        default: ".nvmrc"
      package-dir:
        description: "Directory within the repository where the package is located."
        required: false
        type: string

jobs:
  node-common-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout-ref }}
      - name: Install and enable corepack
        run: |
          npm install -g corepack
          corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: ${{ inputs.node-package-manager }}

      - name: Install dependencies (NPM)
        if: ${{ inputs.node-package-manager == 'npm' }}
        run: npm ci
        working-directory: ${{ inputs.package-dir }}

      - name: Install dependencies (Yarn)
        if: ${{ inputs.node-package-manager == 'yarn' }}
        run: yarn install
        working-directory: ${{ inputs.package-dir }}

      - name: Install dependencies (PNPM)
        if: ${{ inputs.node-package-manager == 'pnpm' }}
        run: pnpm i
        working-directory: ${{ inputs.package-dir }}

      - name: Run Node format checks
        shell: bash
        run: |
          run_script() {
            ${{ inputs.node-package-manager }} run "$1"
          }

          has_script() {
            node -e 'const fs = require("fs"); const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8")); const scripts = packageJson.scripts || {}; process.exit(Object.prototype.hasOwnProperty.call(scripts, process.argv[1]) ? 0 : 1);' "$1"
          }

          if has_script "format:check"; then
            run_script "format:check"
          else
            echo "No format script found in package.json (checked: format:check), skipping format checks"
          fi
        working-directory: ${{ inputs.package-dir }}

      - name: Run Node lint checks
        shell: bash
        run: |
          run_script() {
            ${{ inputs.node-package-manager }} run "$1"
          }

          has_script() {
            node -e 'const fs = require("fs"); const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8")); const scripts = packageJson.scripts || {}; process.exit(Object.prototype.hasOwnProperty.call(scripts, process.argv[1]) ? 0 : 1);' "$1"
          }

          ran_lint_check="false"

          if has_script "biome:check"; then
            run_script "biome:check"
            ran_lint_check="true"
          fi

          if has_script "lint"; then
            run_script "lint"
            ran_lint_check="true"
          fi

          if [[ "$ran_lint_check" != "true" ]]; then
            echo "No lint script found in package.json (checked: biome:check, lint), skipping lint checks"
          fi
        working-directory: ${{ inputs.package-dir }}

      - name: Check Typescript typings
        shell: bash
        run: |
          has_script() {
            node -e 'const fs = require("fs"); const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8")); const scripts = packageJson.scripts || {}; process.exit(Object.prototype.hasOwnProperty.call(scripts, process.argv[1]) ? 0 : 1);' "$1"
          }

          run_script() {
            ${{ inputs.node-package-manager }} run "$1"
          }

          if has_script "compile:check"; then
            run_script "compile:check"
          elif has_script "tsc:check"; then
            run_script "tsc:check"
          elif has_script "typecheck"; then
            run_script "typecheck"
          elif has_script "lint-ts"; then
            run_script "lint-ts"
          else
            echo "No TypeScript check script found in package.json, skipping type checking"
          fi
        working-directory: ${{ inputs.package-dir }}

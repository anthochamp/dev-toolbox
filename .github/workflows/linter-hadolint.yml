name: Hadolint

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: The branch, tag or SHA to checkout. Defaults to the reference or SHA for that event.
        required: false
        type: string
      working-dir:
        description: "Directory within the repository where the package is located."
        required: false
        type: string

jobs:
  hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Lint Dockerfile files
        if: ${{ hashFiles('**/*Dockerfile*') != '' }}
        shell: bash # ensure
        run: shopt -s globstar && docker --context default run --rm -w /workdir -v $(pwd):/workdir hadolint/hadolint:v2.14.0 hadolint **/*Dockerfile*
        working-directory: ${{ inputs.working-dir }}

extends:
  - common.yaml

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.go"
      stage_fixed: true
      run: gofmt -w {staged_files}
    vet:
      glob: "*.go"
      # scan the whole package (cf. https://pkg.go.dev/cmd/vet)
      run: go vet ./...

pre-push:
  commands:
    test:
      run: go test ./...
